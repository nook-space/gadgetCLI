name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and PR: Linux on both supported Node versions. Fast and cheap.
  # Integration tests skip themselves when GADGET_TEST_URL is unset, so this needs
  # no instance; the integration workflow covers the wire.
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  # macOS bills at 10x Linux, so it runs on main (and nightly, via integration.yml)
  # rather than on every PR push. One leg on our minimum Node is enough to catch a
  # platform break; the daily cadence is what matters, not per-commit coverage.
  check-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  # Build the exact tarball a release would publish, so every PR can be installed
  # and inspected before it is tagged.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack
      - name: verify the tarball ships dist and the skill, and nothing else
        run: |
          tar tzf *.tgz | sort | tee contents.txt
          grep -q '^package/dist/cli/main.js$' contents.txt
          grep -q '^package/skill/SKILL.md$' contents.txt
          ! grep -q '\.test\.js$' contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 14
